[package]
name = "oxlfs"
version = "0.1.0"
authors = [
    "KATO Hayate <dev@hayatek.jp>"
]
edition = "2024"
rust-version = "1.88.0"
description = "Git LFS server"
#documentation = ""
readme = "README.md"
homepage = "https://github.com/hayatek-jp/oxlfs#readme"
repository = "https://github.com/hayatek-jp/oxlfs"
license = "AGPL-3.0-only"
keywords = [
    "git",
    "lfs",
]
categories = [
    "filesystem",
    "network-programming",
    "web-programming::http-server",
]
#exclude = []
#include = []
publish = false
default-run = "oxlfs"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.9", features = ["http2"] }
axum-server = "0.8.0"
base64 = "0.23.1"
clap = "4.6.6"
futures = "0.3.34"
futures-util = "0.3.34"
jsonwebtoken = "11.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "fs", "time", "sync", "signal", "process", "tracing"] }
tokio-util = { version = "0.7.19", features = ["io"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }

[features]
default = ["aws-lc-rs", "tls-rustls"]
aws-lc-rs = ["jsonwebtoken/aws_lc_rs"]
rust-crypto = ["jsonwebtoken/rust_crypto"]
tls-openssl = ["axum-server/tls-openssl"]
tls-rustls = ["axum-server/tls-rustls"]
