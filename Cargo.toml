[package]
name = "oxlfs"
version = "0.1.0"
authors = [
    "KATO Hayate <dev@hayatek.jp>"
]
edition = "2024"
#rust-version = ""
description = "Git LFS server"
#documentation = ""
readme = "README.md"
homepage = "https://github.com/hayatek-jp/oxlfs#readme"
repository = "https://github.com/hayatek-jp/oxlfs"
license = "AGPL-3.0-only"
keywords = [
    "git",
    "lfs",
]
categories = [
    "filesystem",
    "network-programming",
    "web-programming::http-server",
]
#exclude = []
#include = []
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["http2"] }
clap = "4.6.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "fs", "time", "sync", "signal", "process", "tracing"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
